name: Windows release candidate
on:
  workflow_dispatch:
  push:
    branches: ["integration/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm test -- --maxWorkers=2
      - run: npm audit
      - run: npm run package:win
      - shell: pwsh
        run: |
          $archive = Get-ChildItem release/*.zip | Select-Object -First 1
          node scripts/verify-package.mjs $archive.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: Mission-Architect-Windows-x64
          path: |
            release/*.zip
            release/*.sha256
          retention-days: 14
