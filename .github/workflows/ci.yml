name: Build and test
on:
  push:
    branches: [main, "feature/**", "integration/**"]
  pull_request:
    branches: [main, "feature/**", "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit
      # Only a tested build from the production branch can be published.
      - name: Upload production build
        if: github.repository == 'ShelB123/mission-architect-spaceapps-2026' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish juego.lycanpro.com
    needs: test
    if: github.repository == 'ShelB123/mission-architect-spaceapps-2026' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Download tested build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-dist
          path: dist
      # An older run must not replace a newer main commit in production.
      - name: Check that this commit is still main
        id: latest
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          latest_sha="$(git ls-remote https://github.com/ShelB123/mission-architect-spaceapps-2026.git refs/heads/main | cut -f1)"
          test -n "$latest_sha"
          if [ "$latest_sha" = "$EXPECTED_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded commit $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy to Cloudflare Pages
        if: steps.latest.outputs.publish == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mission-architect --branch=main --commit-hash=${{ github.sha }}
