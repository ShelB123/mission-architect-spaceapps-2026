name: Build and test
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit
